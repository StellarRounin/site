{{ define "main" }}

<h1>{{ .Title }}</h1>

{{ with .Content }}
{{ . }}
{{ end }}

<div class="projects">
  {{ range .Pages.ByDate.Reverse }}

  <article class="project">
    <h2>
      <a href="{{ .RelPermalink }}">
        {{ .Title }}
      </a>
    </h2>

    {{ with .Params.description }}
    <p>{{ . }}</p>
    {{ end }}

    {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}
      <span>{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}

    <a href="{{ .RelPermalink }}">
      Read more →
    </a>
  </article>
  <hr />

  {{ end }}
</div>

{{ end }}
