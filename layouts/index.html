{{ define "main" }}

{{ .Content }}

<section>
  <h2>Recent posts</h2>

  {{ range first 5 (where site.RegularPages "Section" "blog").ByDate.Reverse }}
  <article>
    <time datetime="{{ .Date.Format " 2006-01-02" }}">
      {{ .Date.Format "02 Jan, 2006" }}
    </time>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </article>
  {{ end }}
  <br>

  <a href="/blog/">View all posts →</a>
</section>

{{ end }}
