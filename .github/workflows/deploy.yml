name: Deploy Hugo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: us.4.pages.tierhive.com
          port: '3523'
          username: ${{ secrets.TH_USER }}
          ssh_private_key: ${{ secrets.TH_KEY }}
          local_path: ./public/*
          remote_path: /
